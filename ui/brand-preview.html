<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Racing Molecule · 品牌图标</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f1eb;color:#191b1a;display:grid;place-items:center;font-family:Arial,'Microsoft YaHei',sans-serif}
    .lockup{display:flex;align-items:center;gap:40px;padding:48px}.mark{width:210px;height:136px}.name{font-weight:800;font-size:51px;letter-spacing:3px;line-height:1.15}.name span{display:block}.caption{font-size:13px;font-weight:400;letter-spacing:4px;margin-top:18px}.caption i{color:#d93b25;font-style:normal;margin-right:17px}
    @media(max-width:640px){.lockup{flex-direction:column;gap:26px;text-align:center;padding:30px}.mark{width:180px;height:116px}.name{font-size:37px}.caption{font-size:11px}}
  </style>
</head>
<body><main class="lockup"><img class="mark" src="./assets/racing-molecule-logo.svg" alt="两个共轭苯环轮子与环丙烷尾巴组成的分子赛车图标"><div class="name"><span>RACING</span><span>MOLECULE</span><div class="caption"><i>/</i>分子赛车</div></div></main></body>
</html>
